# Netlify Build Configuration
[build]
  publish = "."

# Desativa injeção automática de snippets e processamentos do Netlify
[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false
